name: Soccer Data Update

on:
  schedule:
    - cron: '30 5 * * *'  # 1:30 AM ET / 5:30 AM UTC

jobs:
  update-soccer-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Soccer Data Update
        run: python Soccer_Data_Update.py
